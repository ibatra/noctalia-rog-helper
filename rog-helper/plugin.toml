# ROG helper - a G-Helper-style control panel for ASUS ROG laptops.
#
# bar   -> glyph for the current performance mode, with a small dot while a
#          Sleep & lid session is running; click opens the panel.
#          Reads sysfs directly every 10 s (no subprocess, never wakes the dGPU).
# panel -> Performance / GPU / Screen / Battery limit / Keyboard rows, plus a
#          Sleep view (lid rules, the power key, stop conditions). Every
#          action goes through bin/rogctl (bin/awakectl for Sleep & lid):
#          asusctl, powerprofilesctl, hyprctl, systemd-inhibit.
# awake -> Control Center tile ("Stay awake"). Click toggles the last
#          session; right-click opens the panel's Sleep view.
#
# Open it with: noctalia msg panel-toggle ishaan/rog-helper:panel

id = "ishaan/rog-helper"
name = "ROG helper"
version = "0.1.0"
plugin_api = 43
author = "ishaan"
license = "MIT"
dependencies = []
tags = ["hardware", "asus", "power", "gpu", "sleep"]
icon = "device-laptop"
description = "G-Helper-style performance, GPU, screen, battery and keyboard controls for ASUS ROG laptops."

[[setting]]
key = "dry_run"
type = "bool"
label_key = "settings.dry_run.label"
description_key = "settings.dry_run.description"
default = false
advanced = true

[[widget]]
id = "bar"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 316 # Pond panel width, the same as every other bottom-left panel
height = "content" # the card hugs the main view: no empty strip above the nav row
max_height = 640 # panel.luau MAX_H must match: room for notes under the main view; sub-views use 592 and scroll
placement = "floating" # attached panels take the bar's opacity, and the Pond sidebar bar is invisible
position = "bottom_left" # opened from the sidebar's lower half: pops out bottom-aligned, stacked with the Pond panels
open_near_click = false

[[shortcut]]
id = "awake"
entry = "shortcut.luau"
